<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nova Water Reminder</title>
<style>
body{font-family:Arial,sans-serif;background:#eaf8ff;text-align:center;padding:20px;color:#17445c}
.app{max-width:380px;margin:30px auto;background:white;padding:25px;border-radius:24px;box-shadow:0 5px 20px #c4e5f3}
h1{color:#0787c9}
.glass{font-size:70px;margin:15px}
button{background:#0787c9;color:white;border:0;padding:13px 20px;border-radius:12px;font-size:16px;margin:6px;cursor:pointer}
button:hover{background:#05699c}
.progress{background:#dceef7;border-radius:20px;height:16px;overflow:hidden}
#bar{height:100%;width:0;background:#08a9e0;transition:width .3s}
small{color:#557787}
</style>
</head>
<body>
<div class="app">
<h1>💧 Nova Water Reminder</h1>
<p>Stay hydrated, stay healthy!</p>
<div class="glass">🥤</div>
<h2 id="count">0 ml</h2>
<p id="goalText">Daily goal: 2000 ml</p>
<div class="progress"><div id="bar"></div></div>
<p id="percent">0% completed</p>
<button onclick="addWater(250)">+ 250 ml</button>
<button onclick="addWater(500)">+ 500 ml</button>
<button onclick="resetWater()">Reset</button>
<hr>
<h3>⏰ Water Reminder</h3>
<p id="reminder">Reminders are off</p>
<button onclick="toggleReminder()">Turn Reminder On/Off</button>
<small><p>Small sips, big benefits 💙</p></small>
</div>
<script>
let total=Number(localStorage.getItem("novaWater")||0);
let reminderOn=false;
function update(){
document.getElementById("count").textContent=total+" ml";
let p=Math.min(100,Math.round(total/2000*100));
document.getElementById("bar").style.width=p+"%";
document.getElementById("percent").textContent=p+"% completed";
localStorage.setItem("novaWater",total);
}
function addWater(n){total+=n;update();}
function resetWater(){total=0;update();}
function toggleReminder(){
reminderOn=!reminderOn;
document.getElementById("reminder").textContent=reminderOn?"Reminder on (keep this page open)":"Reminders are off";
if(reminderOn){
if("Notification" in window && Notification.permission==="default"){
Notification.requestPermission();
}
if(window.waterTimer)clearInterval(window.waterTimer);
window.waterTimer=setInterval(()=>{
if(reminderOn && "Notification" in window && Notification.permission==="granted"){
new Notification("Nova Water Reminder",{body:"Time to drink some water! 💧"});
}
},60*60*1000);
}else{
if(window.waterTimer)clearInterval(window.waterTimer);
}
}
update();
</script>
</body>
</html>
