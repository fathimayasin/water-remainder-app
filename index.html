<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#d9f5ff">
<title>Nova Water Reminder</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, sans-serif;
  text-align: center;
  color: #24415a;
  background: linear-gradient(160deg, #dff7ff, #fff0f7, #fff8d9);
  overflow-x: hidden;
}

.app {
  width: 100%;
  max-width: 520px;
  min-height: 100vh;
  margin: auto;
  padding: 22px 16px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 16px;
}

h1 {
  font-size: 28px;
  margin: 0;
}

.message {
  width: 100%;
  padding: 16px;
  border-radius: 22px;
  background: white;
  box-shadow: 0 5px 18px #8ab6c533;
  font-size: 22px;
  font-weight: bold;
  line-height: 1.45;
  animation: messagePop .5s ease both;
}

.scene {
  width: 100%;
  min-height: 250px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  position: relative;
  overflow: hidden;
}

.scene img {
  display: block;
  width: 100%;
  max-width: 350px;
  height: 280px;
  object-fit: contain;
  border-radius: 18px;
}

.scene.pair img {
  width: 48%;
  height: 260px;
}

.hidden {
  display: none !important;
}

/* Cute energetic entrance */
.entering {
  animation: actionEntry 1.8s cubic-bezier(.25,1.2,.35,1) both;
}

@keyframes actionEntry {
  0% {
    opacity: 0;
    transform: translateX(-110vw) scale(.55) rotate(-12deg);
  }
  55% {
    opacity: 1;
    transform: translateX(25px) scale(1.12) rotate(5deg);
  }
  72% {
    transform: translateX(-12px) scale(.96) rotate(-3deg);
  }
  88% {
    transform: translateX(5px) scale(1.03) rotate(1deg);
  }
  100% {
    opacity: 1;
    transform: translateX(0) scale(1) rotate(0);
  }
}

/* Drinking scene pop and shake */
.drinkEntry {
  animation: drinkPop .75s cubic-bezier(.2,1.7,.4,1) both;
}

@keyframes drinkPop {
  0% { opacity: 0; transform: scale(.25) rotate(-8deg); }
  65% { opacity: 1; transform: scale(1.12) rotate(4deg); }
  80% { transform: scale(.94) rotate(-3deg); }
  100% { opacity: 1; transform: scale(1) rotate(0); }
}

.pair img:first-child {
  animation: leftBoy .8s ease-out both;
}

.pair img:last-child {
  animation: rightBoy .8s ease-out both;
}

@keyframes leftBoy {
  from { opacity: 0; transform: translateX(-100px) rotate(-12deg); }
  to { opacity: 1; transform: translateX(0) rotate(0); }
}

@keyframes rightBoy {
  from { opacity: 0; transform: translateX(100px) rotate(12deg); }
  to { opacity: 1; transform: translateX(0) rotate(0); }
}

.buttons {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  justify-content: center;
  width: 100%;
}

button {
  border: none;
  border-radius: 18px;
  padding: 15px 18px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  box-shadow: 0 4px 10px #00000018;
  transition: transform .18s, box-shadow .18s;
}

button:active {
  transform: scale(.9);
}

.yes {
  background: #b8f2c5;
  color: #174e2b;
}

.no {
  background: #ffe0a8;
  color: #70420a;
}

.yes:hover, .no:hover {
  transform: translateY(-3px) scale(1.04);
  box-shadow: 0 8px 18px #00000020;
}

.small {
  font-size: 13px;
  color: #526b7d;
}

/* Celebration */
.celebrating {
  animation: happyDance 1s ease-in-out 2;
}

@keyframes happyDance {
  0%, 100% { transform: translateX(0) rotate(0) scale(1); }
  20% { transform: translateX(-9px) rotate(-5deg) scale(1.04); }
  40% { transform: translateX(9px) rotate(5deg) scale(1.08); }
  60% { transform: translateY(-12px) rotate(-3deg) scale(1.04); }
  80% { transform: translateY(3px) rotate(3deg) scale(1); }
}

.confetti {
  position: fixed;
  top: -25px;
  width: 10px;
  height: 16px;
  z-index: 10;
  pointer-events: none;
  animation: confettiFall 2.4s linear forwards;
}

@keyframes confettiFall {
  0% { transform: translateY(-20px) rotate(0); opacity: 1; }
  100% { transform: translateY(110vh) rotate(900deg); opacity: 0; }
}

/* Sad scene */
.sadEntry {
  animation: sadPop .65s ease-out both;
}

@keyframes sadPop {
  0% { opacity: 0; transform: scale(.65) translateY(35px); }
  65% { opacity: 1; transform: scale(1.06) translateY(-5px); }
  100% { opacity: 1; transform: scale(1) translateY(0); }
}

/* Exit */
.leaving {
  animation: exitScene .9s ease-in forwards !important;
}

@keyframes exitScene {
  0% { opacity: 1; transform: translateX(0) scale(1); }
  40% { opacity: 1; transform: translateX(20px) scale(1.04) rotate(3deg); }
  100% { opacity: 0; transform: translateX(110vw) scale(.7) rotate(12deg); }
}

@keyframes messagePop {
  from { opacity: 0; transform: translateY(18px) scale(.9); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
    scroll-behavior: auto !important;
  }
}
</style>
</head>

<body>
<main class="app">
  <h1>💧 Water Time! 💧</h1>

  <div class="message hidden" id="message"></div>

  <div class="scene" id="scene">
    <img id="holding" class="entering"
         src="boys-holding.png.png"
         alt="Both boys holding their water bottles">
  </div>

  <div class="buttons hidden" id="buttons">
    <button class="yes" onclick="answerYes()">💚 YES, I drank it!</button>
    <button class="no" onclick="answerNo()">💧 NOT NOW</button>
  </div>

  <div class="small" id="status">Your little water buddies are coming! 💙</div>
</main>

<script>
const FILES = {
  holding: "boys-holding.png.png",
  boy1: "boy1-drinking.png.png",
  boy2: "boy2-drinking.png.png",
  happy: "boys-happy.png.png",
  sad: "boys-sad.png.png"
};

const scene = document.getElementById("scene");
const message = document.getElementById("message");
const buttons = document.getElementById("buttons");
const statusText = document.getElementById("status");

let reminderTimer;
let sceneTimer;
let confettiTimer;
let currentSceneToken = 0;

function clearTimers() {
  clearTimeout(reminderTimer);
  clearTimeout(sceneTimer);
  clearInterval(confettiTimer);
}

function setMessage(text) {
  message.classList.remove("hidden");
  message.textContent = text;
  message.style.animation = "none";
  void message.offsetWidth;
  message.style.animation = "messagePop .5s ease both";
}

function showImage(src, alt, className = "") {
  scene.className = "scene";
  scene.innerHTML = "";

  const img = document.createElement("img");
  img.src = src;
  img.alt = alt;
  img.className = className;
  scene.appendChild(img);

  return img;
}

function showPair() {
  scene.className = "scene pair drinkEntry";
  scene.innerHTML = `
    <img src="${FILES.boy1}" alt="First boy drinking water">
    <img src="${FILES.boy2}" alt="Second boy drinking water">
  `;
}

function startReminder() {
  clearTimers();
  const token = ++currentSceneToken;

  buttons.classList.add("hidden");
  message.classList.add("hidden");
  statusText.textContent = "Here come your water buddies! 💙";

  const holding = showImage(
    FILES.holding,
    "Both boys holding water bottles",
    "entering"
  );

  sceneTimer = setTimeout(() => {
    if (token !== currentSceneToken) return;

    showPair();

    sceneTimer = setTimeout(() => {
      if (token !== currentSceneToken) return;

      setMessage("Amma, it's time to drink your water! 💧");
      buttons.classList.remove("hidden");
      statusText.textContent = "Let's drink water together! 🥤";
    }, 2500);
  }, 4000);
}

function makeConfetti() {
  const shapes = ["🎉", "✨", "💚", "💛", "🩷", "🟦"];

  for (let i = 0; i < 45; i++) {
    const piece = document.createElement("div");
    piece.className = "confetti";
    piece.textContent = shapes[Math.floor(Math.random() * shapes.length)];
    piece.style.left = Math.random() * 100 + "vw";
    piece.style.animationDelay = Math.random() * .8 + "s";
    piece.style.fontSize = (12 + Math.random() * 14) + "px";
    document.body.appendChild(piece);
    setTimeout(() => piece.remove(), 3500);
  }
}

function scheduleReminder(minutes) {
  clearTimeout(reminderTimer);

  statusText.textContent =
    "Next water reminder in " + minutes + " minutes 💧";

  reminderTimer = setTimeout(() => {
    startReminder();

    if ("Notification" in window &&
        Notification.permission === "granted") {
      new Notification("Water Reminder", {
        body: "Amma, it's time to drink your water!"
      });
    }
  }, minutes * 60 * 1000);
}

function exitAfterScene(minutes) {
  const token = currentSceneToken;
  scene.classList.add("leaving");
  buttons.classList.add("hidden");

  sceneTimer = setTimeout(() => {
    if (token !== currentSceneToken) return;

    scene.className = "scene";
    scene.innerHTML = "";
    scheduleReminder(minutes);
  }, 950);
}

function answerYes() {
  clearTimeout(sceneTimer);
  ++currentSceneToken;

  setMessage("Super Amma! 🎉💖 See you in 60 minutes! 💧");
  buttons.classList.add("hidden");

  const img = showImage(
    FILES.happy,
    "Both boys celebrating happily",
    "drinkEntry celebrating"
  );

  makeConfetti();
  confettiTimer = setInterval(makeConfetti, 1800);

  statusText.textContent = "Yay! Great job, Amma! 💚";

  sceneTimer = setTimeout(() => {
    clearInterval(confettiTimer);
    exitAfterScene(60);
  }, 3200);
}

function answerNo() {
  clearTimeout(sceneTimer);
  ++currentSceneToken;

  setMessage("It's okay, Amma! We'll come back in 10 minutes. 💧");
  buttons.classList.add("hidden");

  showImage(
    FILES.sad,
    "Both boys looking sad",
    "sadEntry"
  );

  statusText.textContent = "We'll remind you again soon. 💙";

  sceneTimer = setTimeout(() => {
    exitAfterScene(10);
  }, 2500);
}

if ("Notification" in window &&
    Notification.permission === "default") {
  Notification.requestPermission();
}

startReminder();
</script>
</body>
</html>
