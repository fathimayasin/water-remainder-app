<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#d9f5ff">

<title>Nova Water Reminder</title>

<link rel="manifest" href="manifest.json">

<style>
* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  min-height: 100%;
}

body {
  font-family: "Trebuchet MS", sans-serif;
  background: transparent;
  overflow: hidden;
}

.app {
  width: 350px;
  max-width: 100%;
  margin: 0 auto;
  padding: 12px;
  text-align: center;
  background: transparent;
  border-radius: 24px;
  position: relative;
  overflow: hidden;
}

.status {
  font-size: 15px;
  font-weight: bold;
  color: #1677a8;
  margin: 6px 0 10px;
}

.message {
  font-size: 18px;
  font-weight: bold;
  line-height: 1.4;
  color: #087ca7;
  margin: 10px 0;
}

.character-area {
  width: 100%;
  min-height: 250px;
  display: flex;
  justify-content: center;
  align-items: center;
  position: relative;
  overflow: hidden;
}

.character {
  display: block;
  max-width: 100%;
  max-height: 280px;
  object-fit: contain;
  margin: auto;
}

.holding-character {
  animation: walkIn 1.2s ease-out both;
}

.drinking-pair {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
  width: 100%;
}

.drinking-pair img {
  width: 48%;
  max-height: 250px;
  object-fit: contain;
  animation: appear 0.8s ease-out both;
}

.buttons {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-top: 14px;
}

button {
  width: 100%;
  padding: 12px 10px;
  border: none;
  border-radius: 18px;
  font-family: inherit;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
  transition: transform 0.2s ease;
}

button:active {
  transform: scale(0.96);
}

.yes-button {
  background: #c9f7d5;
  color: #176d3a;
  box-shadow: 0 4px 10px rgba(60, 170, 100, 0.15);
}

.no-button {
  background: #d9f2ff;
  color: #1677a8;
  box-shadow: 0 4px 10px rgba(50, 140, 190, 0.12);
}

.hidden {
  display: none !important;
}

.happy-character {
  animation: happyBounce 0.8s ease-in-out infinite alternate;
}

.sad-character {
  animation: sadMove 0.6s ease-in-out infinite alternate;
}

.confetti {
  position: absolute;
  top: -15px;
  width: 9px;
  height: 12px;
  border-radius: 2px;
  animation: confettiFall 2s linear forwards;
  pointer-events: none;
  z-index: 5;
}

.tear {
  position: absolute;
  font-size: 24px;
  animation: tearFall 1.2s ease-in forwards;
  pointer-events: none;
}

@keyframes walkIn {
  from {
    transform: translateX(-380px);
    opacity: 0;
  }

  to {
    transform: translateX(0);
    opacity: 1;
  }
}

@keyframes appear {
  from {
    transform: scale(0.75);
    opacity: 0;
  }

  to {
    transform: scale(1);
    opacity: 1;
  }
}

@keyframes happyBounce {
  from {
    transform: translateY(0);
  }

  to {
    transform: translateY(-8px);
  }
}

@keyframes sadMove {
  from {
    transform: translateX(-3px);
  }

  to {
    transform: translateX(3px);
  }
}

@keyframes confettiFall {
  from {
    transform: translateY(-10px) rotate(0deg);
    opacity: 1;
  }

  to {
    transform: translateY(330px) rotate(540deg);
    opacity: 0;
  }
}

@keyframes tearFall {
  from {
    transform: translateY(0);
    opacity: 1;
  }

  to {
    transform: translateY(80px);
    opacity: 0;
  }
}

@media (max-width: 360px) {
  .app {
    width: 100%;
    padding: 8px;
  }

  .character-area {
    min-height: 220px;
  }

  .character {
    max-height: 240px;
  }

  .drinking-pair img {
    max-height: 220px;
  }
}
</style>
</head>

<body>

<div class="app">

  <div id="status" class="status">
    Here come your water buddies! 💙
  </div>

  <div class="character-area" id="characterArea">

    <img
      id="holdingImage"
      class="character holding-character"
      src="boys-holding.png.png"
      alt="Your water buddies holding water bottles"
    >

    <div id="drinkingPair" class="drinking-pair hidden">

      <img
        id="boy1Image"
        src="boy1-drinking.png.png"
        alt="Boy one drinking water"
      >

      <img
        id="boy2Image"
        src="boy2-drinking.png.png"
        alt="Boy two drinking water"
      >

    </div>

    <img
      id="happyImage"
      class="character happy-character hidden"
      src="boys-happy.png.png"
      alt="Happy water buddies"
    >

    <img
      id="sadImage"
      class="character sad-character hidden"
      src="boys-sad.png.png"
      alt="Sad water buddies"
    >

  </div>

  <div id="message" class="message hidden">
    Amma, it's time to drink your water! 💧
  </div>

  <div id="buttons" class="buttons hidden">

    <button
      type="button"
      class="yes-button"
      id="yesButton"
    >
      💚 YES, I drank it!
    </button>

    <button
      type="button"
      class="no-button"
      id="noButton"
    >
      💧 NOT NOW
    </button>

  </div>

</div>

<!-- AUDIO FILES -->

<audio
  id="holdingAudio"
  src="holding.mp3"
  preload="auto"
></audio>

<audio
  id="drinkingAudio"
  src="drinking.mp3"
  preload="auto"
></audio>

<audio
  id="notNowAudio"
  src="not-now.mp3"
  preload="auto"
></audio>

<audio
  id="happyAudio"
  src="happy.mp3"
  preload="auto"
></audio>

<script>
"use strict";

/* =====================================
   NOVA WATER REMINDER
   ===================================== */

const REMINDER_AFTER_YES = 60 * 60 * 1000;
const REMINDER_AFTER_NO = 10 * 60 * 1000;
const DRINKING_DELAY = 4000;

const holdingImage = document.getElementById("holdingImage");
const drinkingPair = document.getElementById("drinkingPair");
const happyImage = document.getElementById("happyImage");
const sadImage = document.getElementById("sadImage");

const statusText = document.getElementById("status");
const messageText = document.getElementById("message");
const buttons = document.getElementById("buttons");
const characterArea = document.getElementById("characterArea");

const holdingAudio = document.getElementById("holdingAudio");
const drinkingAudio = document.getElementById("drinkingAudio");
const notNowAudio = document.getElementById("notNowAudio");
const happyAudio = document.getElementById("happyAudio");

let reminderTimer = null;
let drinkingTimer = null;
let finishTimer = null;

/* =====================================
   AUDIO CONTROL
   ===================================== */

const allAudio = [
  holdingAudio,
  drinkingAudio,
  notNowAudio,
  happyAudio
];

function stopAudio() {
  allAudio.forEach(function(audio) {
    audio.pause();

    try {
      audio.currentTime = 0;
    } catch (error) {
      // Audio may not have loaded yet.
    }
  });
}

function playAudio(audio) {
  stopAudio();

  if (!audio) {
    return;
  }

  try {
    audio.currentTime = 0;

    const playPromise = audio.play();

    if (playPromise && typeof playPromise.catch === "function") {
      playPromise.catch(function(error) {
        console.warn("Audio playback was blocked or failed:", error);
      });
    }
  } catch (error) {
    console.warn("Unable to play audio:", error);
  }
}

/* =====================================
   RESET CHARACTER DISPLAY
   ===================================== */

function hideAllCharacters() {
  holdingImage.classList.add("hidden");
  drinkingPair.classList.add("hidden");
  happyImage.classList.add("hidden");
  sadImage.classList.add("hidden");
}

function clearTimers() {
  if (reminderTimer !== null) {
    clearTimeout(reminderTimer);
    reminderTimer = null;
  }

  if (drinkingTimer !== null) {
    clearTimeout(drinkingTimer);
    drinkingTimer = null;
  }

  if (finishTimer !== null) {
    clearTimeout(finishTimer);
    finishTimer = null;
  }
}

/* =====================================
   START WATER REMINDER
   ===================================== */

function startReminder() {
  clearTimers();
  stopAudio();

  hideAllCharacters();

  holdingImage.classList.remove("hidden");
  holdingImage.classList.remove("holding-character");

  // Restart the entrance animation.
  void holdingImage.offsetWidth;

  holdingImage.classList.add("holding-character");

  statusText.textContent = "Here come your water buddies! 💙";

  messageText.textContent =
    "Amma, it's time to drink your water! 💧";

  messageText.classList.add("hidden");
  buttons.classList.add("hidden");

  // Play holding audio when the holding image appears.
  playAudio(holdingAudio);

  // After four seconds, show both boys drinking.
  drinkingTimer = setTimeout(function() {
    holdingImage.classList.add("hidden");

    drinkingPair.classList.remove("hidden");

    statusText.textContent = "Water time, Amma! 💙";

    messageText.classList.remove("hidden");
    buttons.classList.remove("hidden");

    // Play drinking audio when the drinking images appear.
    playAudio(drinkingAudio);

  }, DRINKING_DELAY);
}

/* =====================================
   CONFETTI EFFECT
   ===================================== */

function createConfetti() {
  const confettiSymbols = [
    "💚", "💙", "💧", "✨", "🎉"
  ];

  for (let i = 0; i < 24; i++) {
    const piece = document.createElement("span");

    piece.className = "confetti";

    piece.textContent =
      confettiSymbols[
        Math.floor(Math.random() * confettiSymbols.length)
      ];

    piece.style.left = Math.random() * 100 + "%";
    piece.style.animationDelay = Math.random() * 0.8 + "s";

    characterArea.appendChild(piece);

    setTimeout(function() {
      piece.remove();
    }, 3000);
  }
}

/* =====================================
   TEAR EFFECT
   ===================================== */

function createTears() {
  for (let i = 0; i < 6; i++) {
    const tear = document.createElement("span");

    tear.className = "tear";
    tear.textContent = "💧";

    tear.style.left = (25 + Math.random() * 50) + "%";
    tear.style.top = (35 + Math.random() * 20) + "%";
    tear.style.animationDelay = (Math.random() * 0.5) + "s";

    characterArea.appendChild(tear);

    setTimeout(function() {
      tear.remove();
    }, 1800);
  }
}

/* =====================================
   YES — I DRANK WATER
   ===================================== */

function answerYes() {
  clearTimers();
  stopAudio();

  hideAllCharacters();

  happyImage.classList.remove("hidden");

  statusText.textContent = "Super Amma! 💚";

  messageText.textContent =
    "Super Amma! You drank your water! 💧 See you in 60 minutes!";

  messageText.classList.remove("hidden");
  buttons.classList.add("hidden");

  // Play happy audio when YES is clicked.
  playAudio(happyAudio);

  createConfetti();

  finishTimer = setTimeout(function() {
    stopAudio();

    startNextReminder(REMINDER_AFTER_YES);
  }, 3200);
}

/* =====================================
   NOT NOW — REMIND AFTER TEN MINUTES
   ===================================== */

function answerNo() {
  clearTimers();
  stopAudio();

  hideAllCharacters();

  sadImage.classList.remove("hidden");

  statusText.textContent = "Aww Amma! 🥺💙";

  messageText.textContent =
    "That's okay, Amma! We'll try again in 10 minutes. 💧";

  messageText.classList.remove("hidden");
  buttons.classList.add("hidden");

  // Play not-now audio when NOT NOW is clicked.
  playAudio(notNowAudio);

  createTears();

  finishTimer = setTimeout(function() {
    stopAudio();

    startNextReminder(REMINDER_AFTER_NO);
  }, 4000);
}

/* =====================================
   SCHEDULE NEXT REMINDER
   ===================================== */

function startNextReminder(delay) {
  clearTimers();

  reminderTimer = setTimeout(function() {
    startReminder();
  }, delay);
}

/* =====================================
   BUTTON EVENTS
   ===================================== */

document
  .getElementById("yesButton")
  .addEventListener("click", answerYes);

document
  .getElementById("noButton")
  .addEventListener("click", answerNo);

/* =====================================
   START APP
   ===================================== */

startReminder();

/* =====================================
   SERVICE WORKER
   ===================================== */

if ("serviceWorker" in navigator) {
  window.addEventListener("load", function() {
    navigator.serviceWorker.register("./Service-worker.js")
      .then(function(registration) {
        console.log(
          "Nova Water Reminder service worker registered:",
          registration.scope
        );
      })
      .catch(function(error) {
        console.error(
          "Service worker registration failed:",
          error
        );
      });
  });
}
</script>

</body>
</html>
