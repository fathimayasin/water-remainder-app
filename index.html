<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#d9f5ff">
<title>Water Reminder</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, sans-serif;
  text-align: center;
  color: #24415a;
  background: linear-gradient(160deg, #dff7ff, #fff0f7, #fff8d9);
  overflow-x: hidden;
}

.app {
  width: 100%;
  max-width: 520px;
  min-height: 100vh;
  margin: auto;
  padding: 25px 18px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 18px;
}

h1 {
  font-size: 28px;
  margin: 0;
}

.message {
  font-size: 23px;
  font-weight: bold;
  line-height: 1.5;
  background: white;
  border-radius: 22px;
  padding: 18px;
  box-shadow: 0 5px 18px #8ab6c533;
  width: 100%;
}

.boys {
  width: 100%;
  max-width: 350px;
  height: 280px;
  object-fit: contain;
  border-radius: 20px;
  animation: arrive 1.2s ease-out both;
}

@keyframes arrive {
  from {
    transform: translateX(-120vw);
    opacity: 0;
  }
  to {
    transform: translateX(0);
    opacity: 1;
  }
}

@keyframes leave {
  from {
    transform: translateX(0);
    opacity: 1;
  }
  to {
    transform: translateX(120vw);
    opacity: 0;
  }
}

.boys.leaving {
  animation: leave 0.9s ease-in forwards;
}

.buttons {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  justify-content: center;
}

button {
  border: none;
  border-radius: 18px;
  padding: 15px 20px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  box-shadow: 0 4px 10px #00000018;
}

.yes { background: #b8f2c5; color: #174e2b; }
.no { background: #ffe0a8; color: #70420a; }

.small {
  font-size: 13px;
  color: #526b7d;
}
  .boys-container {
  display: flex;
  justify-content: center;
  align-items: flex-end;
  gap: 20px;
  margin: 20px auto;
}

.boy {
  width: 130px;
  height: auto;
  animation: boyWalk 2s ease-out 1 forwades;
}

.boy1 {
  animation-delay: 0s;
}

.boy2 {
  animation-delay: 0.25s;
}

@keyframes boyWalk {
  0% {
    transform: translateX(-300px) translateY(0) rotate(-5deg);
  }
  40% {
    transform: translateX(-100px) translateY(-5px) rotate(3deg);
  }
  70% {
    transform: translateX(0) translateY(0) rotate(-2deg);
  }
  100% {
    transform: translateX(0) translateY(0) rotate(0deg);
  }
}
</style>
</head>

<body>
<main class="app">
  <h1>💧 Water Time! 💧</h1>

  <div class="message" id="message">
    Amma, it's time to drink your water!
  </div>

  <video
    class="boys"
    id="boys"
    autoplay
    muted
    playsinline
    loop
  >
    <source src="boys-reminder.mp4" type="video/mp4">
  </video>

  <div class="buttons" id="buttons">
    <button class="yes" onclick="answerYes()">
      ✅ YES, I drank water!
    </button>
    <button class="no" onclick="answerNo()">
      💧 NO, not yet!
    </button>
  </div>

  <div class="small" id="status">
    Your little water buddies are here! 💙
  </div>
</main>

<script>
let reminderTimer;

function scheduleReminder(minutes) {
  clearTimeout(reminderTimer);

  document.getElementById("status").textContent =
    "Next water reminder in " + minutes + " minutes 💧";

  reminderTimer = setTimeout(() => {
    showReminder();
    if ("Notification" in window &&
        Notification.permission === "granted") {
      new Notification("Water Reminder", {
        body: "Amma, it's time to drink your water!"
      });
    }
  }, minutes * 60 * 1000);
}

function showReminder() {
  const boys = document.getElementById("boys");
  const message = document.getElementById("message");

  boys.classList.remove("leaving");
  boys.style.animation = "none";
  void boys.offsetWidth;
  boys.style.animation = "";
  boys.style.animation = "arrive 1.2s ease-out both";

  message.textContent = "Amma, it's time to drink your water!";
  document.getElementById("buttons").style.display = "flex";
}

function respond(text, minutes) {
  const boys = document.getElementById("boys");

  document.getElementById("message").textContent = text;
  document.getElementById("buttons").style.display = "none";

  boys.classList.remove("leaving");
  void boys.offsetWidth;
  boys.classList.add("leaving");

  scheduleReminder(minutes);
}

function answerYes() {
  respond("Super Amma! 💖 See you in 60 minutes! 💧", 60);
}

function answerNo() {
  respond("Okay Amma! 😊 We'll come back in 10 minutes! 💧", 10);
}

if ("Notification" in window &&
    Notification.permission === "default") {
  Notification.requestPermission();
}
</script>
</body>
</html>
